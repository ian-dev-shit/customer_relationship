name: Frontend CI (PHP - No Composer)

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'

jobs:
  php-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: json, curl, mbstring
        tools: none 
    - name: Check PHP Syntax Errors (Linting)
      run: |
        # Ini-scan nito ang lahat ng .php files sa iyong frontend
        find . -path ./myvenv -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l