name: Backend CI (Python FastAPI)

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend-api/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend-api/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend-api

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.3'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Isinama ang httpx dahil ito ang default client na ginagamit para sa FastAPI async tests
        pip install flake8 pytest httpx 
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8 (Code Style Check)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=myvenv
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=myvenv

    - name: Run Tests with Pytest
      env:
        SUPABASE_URL: "https://dummy-url.supabase.co"
        SUPABASE_KEY: "dummy-key"
        SUPABASE_URL_2: "https://dummy-url-2.supabase.co"
        SUPABASE_KEY_2: "dummy-key-2"
        SUPABASE_JWT_SECRET: "dummy-jwt-secret"
        SMTP_SENDER: "test@gmail.com"
        SMTP_PASSWORD: "testpassword"
        APP_ENV: "testing"
        UPSTASH_REDIS_REST_URL: "https://dummy-redis.upstash.io"
        UPSTASH_REDIS_REST_TOKEN: "dummy_token"
      run: |
        # Ituro ang PYTHONPATH sa root ng backend project (.)
        python -m pytest app/test -v --import-mode=importlib